name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # 等待名单收集端：由仓库 secret 注入，构建期打进静态页。
          # 未配置时表单保持不可提交态（data-collecting=false），不谎称已加入。
          PUBLIC_WAITLIST_ENDPOINT: ${{ secrets.PUBLIC_WAITLIST_ENDPOINT }}
        run: pnpm build

      - name: Sanity checks
        run: |
          set -euo pipefail
          mapfile -t pages < <(find dist -name '*.html')
          (( ${#pages[@]} > 0 )) || { echo "::error::no pages emitted"; exit 1; }
          for f in "${pages[@]}"; do
            # 站内不得有占位死链
            if grep -n 'href="#"\|href=""' "$f"; then
              echo "::error::$f has a dead placeholder link"; exit 1; fi
            # 资产路径不得上跳站点根
            if grep -nE '(src|href|content)="[^"]*\.\./' "$f"; then
              echo "::error::$f escapes the site root"; exit 1; fi
            # 自定义域名下 base 为根：页面不得再出现 /wrisp-site/ 前缀（手工拼 URL 的回归风险）
            if grep -n '/wrisp-site/' "$f"; then
              echo "::error::$f still carries the old /wrisp-site/ base prefix"; exit 1; fi
            # 写在模板里的说明注释会随 HTML 一起发给访问者（也顺带说明实现细节）：产物不留注释
            # 页面是单行压缩 HTML，用 -o 只摘注释片段，别把整页打进 CI 日志
            if hits=$(grep -o '<!--[^>]\{0,60\}' "$f"); then
              echo "::error::$f ships a HTML comment: $hits"; exit 1; fi
            # 中英两页各自落地，lang 必须与目录一致
            case "$f" in
              dist/zh/*) grep -q 'html lang="zh-CN"' "$f" || { echo "::error::$f lang mismatch"; exit 1; } ;;
            esac
            # 双语互指必须成对：缺任一侧，另一侧的 hreflang 会被搜索引擎整组丢弃
            for lang in en zh-CN x-default; do
              grep -q "hreflang=\"$lang\"" "$f" || { echo "::error::$f missing hreflang $lang"; exit 1; }
            done
            # 内容已定稿的页面不得残留挡索引标记
            if grep -q 'name="robots" content="noindex' "$f"; then
              echo "::error::$f is still noindex"; exit 1; fi
          done
          # 多页之后写错一段路径就是死链：站内每个绝对 href 都要落在 dist 里的真实对象上
          for page in "${pages[@]}"; do
            while IFS= read -r target; do
              [[ -z "$target" ]] && continue
              base="${target%/}"
              if [[ -e "dist/${base}" || -e "dist/${base}/index.html" ]]; then continue; fi
              echo "::error::${page} links to /${target}, which is not in dist"
              exit 1
            done < <(grep -o 'href="/[^"#]*' "$page" | sed 's|href="/||' | sort -u)
          done
          # 自托管子集只许 Newsreader 700 这一份：四个页面各发一次、规则只许一条、来源必须是站内 /assets。
          # 两个 grep 在无匹配时退出 1；这一步开着 pipefail，所以显式 || true，
          # 让下面的条数断言去报错，而不是整步静默中止。
          faces=$(grep -rho '@font-face[[:space:]]*{[^}]*}' dist --include='*.html' | sort -u || true)
          n=$(grep -rl '@font-face' dist --include='*.html' | wc -l || true)
          if [[ "$n" -ne 4 ]]; then
            echo "::error::@font-face found in $n html pages, expected exactly 4: $(grep -rl '@font-face' dist --include='*.html' | tr '\n' ' ' || true)"; exit 1; fi
          if [[ -z "$faces" ]]; then
            echo "::error::html carries @font-face but the rule shape matched nothing - output format changed, update this guard"; exit 1; fi
          if [[ $(printf '%s\n' "$faces" | wc -l) -ne 1 ]]; then
            echo "::error::expected exactly one @font-face rule, found $(printf '%s\n' "$faces" | wc -l): ${faces//$'\n'/, }"; exit 1; fi
          if [[ "$faces" != *"font-family:'Newsreader'"* || "$faces" != *"font-weight:700"* || "$faces" != *"src:url('/assets/newsreader-700-latin.woff2')"* ]]; then
            echo "::error::@font-face is not the sanctioned Newsreader 700 subset: ${faces//$'\n'/, }"; exit 1; fi
          if grep -rq '@font-face' dist --include='*.css'; then
            echo "::error::@font-face leaked into a css bundle; it must stay inline in html"; exit 1; fi
          remote=$(grep -rhoE "https?://[^\"')[:space:]]*\.(woff2|woff|ttf|otf)" dist --include='*.html' --include='*.css' | sort -u || true)
          if [[ -n "$remote" ]]; then
            echo "::error::remote font payload referenced: ${remote//$'\n'/, }"; exit 1; fi
          fonts=$(find dist \( -name '*.woff' -o -name '*.woff2' -o -name '*.ttf' -o -name '*.otf' \) -printf '%f\n' | sort || true)
          if [[ "$fonts" != "newsreader-700-latin.woff2" ]]; then
            echo "::error::unexpected font payloads: ${fonts//$'\n'/, }"; exit 1; fi
          # 站点地图与 robots 属构建期产物：缺文件即等于没配 SEO，直接挡下
          [[ -f dist/robots.txt && -f dist/sitemap.xml ]] || {
            echo "::error::robots.txt or sitemap.xml missing — pnpm build must generate them"; exit 1; }
          # 域名口径只在 robots.txt 里读一次：站点地图的每条 loc 都得长在同一个源上
          origin=$(sed -n 's|^Sitemap: \(.*\)/sitemap\.xml$|\1|p' dist/robots.txt)
          [[ -n "$origin" ]] || { echo "::error::robots.txt has no absolute Sitemap URL"; exit 1; }
          while IFS= read -r loc; do
            rel="${loc#"$origin"/}"
            rel="${rel%/}"
            if [[ -z "$rel" ]]; then target=dist/index.html; else target="dist/$rel/index.html"; fi
            [[ -f "$target" ]] || { echo "::error::sitemap lists $loc but $target is missing"; exit 1; }
          done < <(grep -o '<loc>[^<]*' dist/sitemap.xml | sed 's|<loc>||')

      - name: Token integrity
        run: node scripts/check-tokens.mjs

      - name: Copy coverage
        run: pnpm check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
