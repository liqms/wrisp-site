name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Sanity checks
        run: |
          set -euo pipefail
          mapfile -t pages < <(find dist -name '*.html')
          (( ${#pages[@]} > 0 )) || { echo "::error::no pages emitted"; exit 1; }
          for f in "${pages[@]}"; do
            # 站内不得有占位死链
            if grep -n 'href="#"\|href=""' "$f"; then
              echo "::error::$f has a dead placeholder link"; exit 1; fi
            # 资产路径不得上跳站点根
            if grep -nE '(src|href|content)="[^"]*\.\./' "$f"; then
              echo "::error::$f escapes the site root"; exit 1; fi
            # base 前缀只能出现一次（手工拼 URL 的回归风险）
            if grep -n '/wrisp-site/wrisp-site/' "$f"; then
              echo "::error::$f has a doubled base path"; exit 1; fi
            # 中英两页各自落地，lang 必须与目录一致
            case "$f" in
              dist/zh/*) grep -q 'html lang="zh-CN"' "$f" || { echo "::error::$f lang mismatch"; exit 1; } ;;
            esac
            # 双语互指必须成对：缺任一侧，另一侧的 hreflang 会被搜索引擎整组丢弃
            for lang in en zh-CN x-default; do
              grep -q "hreflang=\"$lang\"" "$f" || { echo "::error::$f missing hreflang $lang"; exit 1; }
            done
            # 内容已定稿的页面不得残留挡索引标记
            if grep -q 'name="robots" content="noindex' "$f"; then
              echo "::error::$f is still noindex"; exit 1; fi
          done
          # 多页之后写错一段路径就是死链：站内每个绝对 href 都要落在 dist 里的真实对象上
          for page in "${pages[@]}"; do
            while IFS= read -r target; do
              [[ -z "$target" ]] && continue
              base="${target%/}"
              if [[ -e "dist/${base}" || -e "dist/${base}/index.html" ]]; then continue; fi
              echo "::error::${page} links to /${target}, which is not in dist"
              exit 1
            done < <(grep -o 'href="/wrisp-site/[^"#]*' "$page" | sed 's|href="/wrisp-site/||' | sort -u)
          done
          # 字体必须是系统栈，不允许引入 webfont 负载
          if grep -rn '@font-face' dist --include='*.css' --include='*.html'; then
            echo "::error::webfont payload detected"; exit 1; fi

      - name: Copy coverage
        run: pnpm check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
