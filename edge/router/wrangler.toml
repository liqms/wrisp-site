# 边缘路由层的配置。
#
# 【这一层还挂不挂】2026-11-11 起路由层改用 Cloudflare Redirect Rules 实现并上线
# （www.trywrisp.com，3 条规则见 edge/README.md「跳转层 router/」），本站点的 Worker
# 不再需要部署——内容源就是 Pages 自定义域本身，Worker 挡在前面会自引用循环。
# 本文件与 worker.js 保留作参考实现（判定表 / 透传头白名单 / smoke.mjs 27 条）。
#
# 若未来要把入口与内容源拆开（例如裸域入口 + 子路径内容源），按下面的模板恢复部署。

name = "wrisp-router"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# 内容层。改了站点托管位置只动这一处。
ORIGIN = "https://liqms.github.io"
# Pages 项目站的子路径；换成根域名后改成空串。
BASE_PATH = "/wrisp-site"
# 用来在上线前验「CN → /zh/」这条回路；线上不要设，留空才会真读 cf-ipcountry。
# FORCE_COUNTRY = "CN"

# 域名到手后，二选一：
#   1) Workers 路由：在 Cloudflare 上给域名加一条记录（Proxied），然后启用下面的 routes；
#   2) Cloudflare Pages + `_worker.js`：把 worker.js 放到 Pages 项目根，Pages 会自动用它做兜底路由。
# [[routes]]
# pattern = "wrisp.io"
# custom_domain = true

# 上线后要先确认的一件事：cf-ipcountry 在该账号的 Worker 里是否可见。
# 拿不到就只按 Accept-Language + cookie 判，判定表不变，只是猜的线索少一条——
# 不要因为少一条线索就改成嗅探响应体（那是铁律 3）。
